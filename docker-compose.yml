services:

  web:
    build: .
    container_name: pi_2_sem_php_apache

    ports:
      - "8081:80"

    volumes:
      - ./app:/var/www/app
      - ./public:/var/www/public

    depends_on:
      - db


  db:
    image: mysql:8.0
    container_name: pi_2_sem_mysql_db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: sua_senha
      MYSQL_DATABASE: playpark
      MYSQL_USER: admin
      MYSQL_PASSWORD: sua_senha

    volumes:
      - ./mysql-data:/var/lib/mysql

    ports:
      - "3307:3306"


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pi_2_sem_phpmyadmin

    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1

    ports:
      - "8889:80"

    depends_on:
      - db